<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">A fox on a skateboard</title>
  <desc id="desc">A cheerful orange fox rides a teal skateboard through a sunny landscape.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#f8e9cd"/>
      <stop offset="1" stop-color="#fff8e9"/>
    </linearGradient>
    <linearGradient id="fur" x2="0.8" y2="1">
      <stop stop-color="#f7a54b"/>
      <stop offset="1" stop-color="#e97832"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="28" fill="url(#sky)"/>
  <circle cx="303" cy="91" r="31" fill="#f7c96a" opacity=".7"/>
  <path d="M0 264 Q78 228 148 262 T290 255 T400 249 V400 H0Z" fill="#e9e5c9"/>
  <path d="M0 300 Q72 275 146 296 T291 290 T400 284 V400 H0Z" fill="#d7e1c6"/>
  <path d="M0 344 Q109 329 207 342 T400 334 V400 H0Z" fill="#c3d5b8"/>
  <g fill="none" stroke="#fffaf0" stroke-linecap="round" opacity=".8">
    <path d="M64 112h39m-29 10h23" stroke-width="5"/>
    <path d="M287 154h44m-33 10h25" stroke-width="5"/>
    <path d="M55 210h27m-39 12h30" stroke-width="4"/>
  </g>
  <g fill="#e8ad54">
    <path d="M104 158l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="M289 214l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
  </g>

  <ellipse cx="207" cy="338" rx="122" ry="10" fill="#789a80" opacity=".25"/>

  <!-- Skateboard and wheels -->
  <g stroke="#394942" stroke-linecap="round" stroke-linejoin="round">
    <path d="M132 300l7 15h19l6-15m91 0 6 15h19l7-15" fill="none" stroke-width="6"/>
    <circle cx="149" cy="319" r="13" fill="#f4b661" stroke-width="4"/>
    <circle cx="270" cy="319" r="13" fill="#f4b661" stroke-width="4"/>
    <circle cx="149" cy="319" r="4" fill="#fff5da" stroke="none"/>
    <circle cx="270" cy="319" r="4" fill="#fff5da" stroke="none"/>
    <path d="M96 287q4-1 8 4 3 3 11 3h178q12 0 17-10 2-4 6-2 4 2 2 7l-4 10q-3 7-14 7H114q-12 0-16-8l-5-7q-2-3 3-4z" fill="#4e9f91" stroke-width="4"/>
    <path d="M107 297h197" fill="none" stroke="#a9ded0" stroke-width="3"/>
  </g>

  <!-- Tail -->
  <path d="M181 230q-24 3-43-10-21-14-39-9-8 2-12 9 4 35 34 46 29 11 63-4l18-17z" fill="url(#fur)" stroke="#7d4935" stroke-width="4" stroke-linejoin="round"/>
  <path d="M87 220q4-7 12-9 14-4 29 4l-8 6 7 5-10 5 5 7-11 2 4 9q-23-9-28-29z" fill="#fff1d8"/>

