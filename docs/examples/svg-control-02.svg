  <ellipse cx="226" cy="153" rx="4" ry="5.5" fill="#49382e"/>
  <circle cx="182" cy="151.5" r="1.3" fill="#fff"/>
  <circle cx="227" cy="151.5" r="1.3" fill="#fff"/>
  <ellipse cx="169" cy="166" rx="7" ry="4" fill="#ed9c82" opacity=".65"/>
  <ellipse cx="239" cy="166" rx="7" ry="4" fill="#ed9c82" opacity=".65"/>
  <path d="M199 174q5-4 10 0-1 5-5 5t-5-5z" fill="#49382e"/>
  <path d="M204 179q0 6-6 7m6-7q0 6 6 7" fill="none" stroke="#7d4935" stroke-width="2" stroke-linecap="round"/>

