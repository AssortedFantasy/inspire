<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Skateboarding cat</title>
  <desc id="desc">A cheerful orange cat rides a teal skateboard against a warm background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff8e9"/>
      <stop offset="1" stop-color="#f9e6d8"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffc46e"/>
      <stop offset="1" stop-color="#ee8b50"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="28" fill="url(#background)"/>
  <circle cx="205" cy="185" r="142" fill="#f7cdb9"/>
  <circle cx="205" cy="185" r="119" fill="#fbdccc" opacity=".65"/>

  <g fill="none" stroke="#d99881" stroke-linecap="round" opacity=".65">
    <path d="M55 233h48M43 246h37M62 259h28" stroke-width="4"/>
    <path d="M299 124h22M310 113h10M325 135h14" stroke-width="3"/>
  </g>
  <g fill="#fff9ec" opacity=".85">
    <path d="M107 104l3-9 3 9 9 3-9 3-3 9-3-9-9-3z"/>
    <path d="M313 205l2-6 2 6 6 2-6 2-2 6-2-6-6-2z"/>
  </g>

  <ellipse cx="208" cy="345" rx="140" ry="10" fill="#bc8b7c" opacity=".17"/>
