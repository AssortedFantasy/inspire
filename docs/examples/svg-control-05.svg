    <path d="M132 306l8 13h17l5-13M263 306l5 13h17l8-13" fill="#edb75b"/>
    <circle cx="146" cy="325" r="12" fill="#f4b665"/>
    <circle cx="278" cy="325" r="12" fill="#f4b665"/>
    <circle cx="146" cy="325" r="4" fill="#fff3d7" stroke-width="2"/>
    <circle cx="278" cy="325" r="4" fill="#fff3d7" stroke-width="2"/>
