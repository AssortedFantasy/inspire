[package]
name = "inspire"
version = "0.1.0"
edition = "2024"
description = "Small, local inspiration samples for creative decisions"
publish = false

[dependencies]
miniz_oxide = "0.8"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
serde_json = "1"

[build-dependencies]
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = "0.30.2"
toml = "0.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
